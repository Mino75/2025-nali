<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nali Nav - 哪里</title>

  <script defer src="https://analytics.kahiether.com/script.js" data-website-id="0fa7c572-1545-494e-a38e-f960dbb2c86b"></script>
  <script defer src="https://kizuna.kahiether.com/main.js?website-url=https://yoursite.com&personalinfostored=no&enablemdquizz=yes&enablejssandbox=no&enableprivacy=yes"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet core CSS -->
  <link rel="stylesheet" href="leaflet.css">

  <!-- App styles injected -->
  <script src="styles.js"></script>

  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Burger (menu) -->
  <button id="burger-btn">&#9776;</button>

  <!-- Compass overlay -->
  <div id="compassOverlay">--°</div>

  <!-- Offline navigation status overlay -->
  <div id="offlineNavStatus">Navigation OFF</div>

  <!-- Latest positions overlay -->
  <div id="latestPositionsOverlay"></div>

  <!-- Map full-screen -->
  <div id="map"></div>

  <!-- Control modal -->
  <div id="controlModal" class="modal">
    <div class="modal-content">

      <span id="closeModal" class="close">&times;</span>

      <h2>Nali Nav · Control Panel</h2>

      <button id="geolocBtn">Get Geolocation</button>
      <button id="ipBtn">Get IP Address</button>
      <button id="compassBtn">Start Compass</button>
      <button id="stopCompassBtn" style="display:none;">Stop Compass</button>
      <button id="openGMapsBtn">Open Google Maps</button>

      <button id="offlineNavBtn">Offline Navigation: OFF</button>

      <button id="clearBtn">Clear All</button>

      <button id="showDataBtn">Show Data & History</button>

      <pre id="dataDisplay"></pre>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="leaflet.js"></script>

  <!-- Main app logic -->
  <script src="main.js"></script>
</body>
</html>
